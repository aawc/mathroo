<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kangaroo Practice</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <!-- Cloudflare Web Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4af1d7411ba644c2887c9fac1a1cfc50"}'></script>
    <!-- End Cloudflare Web Analytics -->
</head>
<body data-bs-theme="dark">
    <div class="container my-4">
        <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
            <h1 class="text-primary">Math Kangaroo Practice</h1>
            <button id="theme-toggle" class="btn btn-outline-secondary">☀️</button>
        </header>

        <main>
            <!-- Setup Section -->
            <section id="setup" class="card p-4 mb-4 shadow-sm">
                <div class="mb-3">
                    <label for="grade-select" class="form-label">Choose your grade:</label>
                    <select id="grade-select" class="form-select">
                        <option value="">Select...</option>
                        <option value="1-2">Grade 1-2</option>
                        <option value="3-4">Grade 3-4</option>
                        <option value="5-6">Grade 5-6</option>
                    </select>
                </div>
                <button id="start-btn" class="btn btn-primary">Start Practice</button>
                <button id="view-history-btn" class="btn btn-outline-info ms-2">View History</button>
            </section>

            <!-- History Section -->
            <section id="history-section" class="card p-4 mb-4 shadow-sm d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="text-primary m-0">Past Attempts</h2>
                    <button id="back-to-setup-btn" class="btn btn-outline-secondary">Back</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Grade</th>
                                <th>Score</th>
                                <th>Time</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="history-list">
                            <!-- History items will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Quiz Section -->
            <section id="quiz" class="d-none">
                <div id="hud" class="card p-3 mb-4 shadow-sm sticky-top">
                    <div class="d-flex justify-content-between align-items-center">
                        <div id="timer-container" class="d-flex align-items-center gap-2">
                            <span id="timer" class="fw-bold">Time: 00:00</span>
                            <button id="pause-btn" class="btn btn-sm btn-warning">Pause</button>
                            <button id="quit-btn" class="btn btn-sm btn-outline-secondary ms-2">Home</button>
                        </div>
                        <div id="current-score" class="fw-bold">Score: 0</div>
                    </div>
                </div>

                <div id="badges-container" class="card p-3 mb-4 border-warning d-none">
                    <h3>Earned Badges:</h3>
                    <div id="badges-list" class="d-flex gap-2 flex-wrap"></div>
                </div>

                <div id="questions-container" class="mb-4"></div>

                <button id="submit-btn" class="btn btn-success btn-lg w-100 mb-4">Submit Answers</button>

                <div id="results" class="alert alert-info d-none" role="alert"></div>

                <!-- Permalink Section -->
                <div id="permalink-container" class="card p-3 mb-4 shadow-sm">
                    <p class="mb-2">Permalink to this practice set:</p>
                    <div class="input-group">
                        <input type="text" id="permalink-input" class="form-control" readonly>
                        <button id="copy-link-btn" class="btn btn-outline-secondary">Copy Link</button>
                    </div>
                </div>
            </section>
        </main>
        
        <footer class="text-center text-muted mt-4 pb-3">
            <small>This site is a hobby project for personal use and not affiliated with the Math Kangaroo organization.</small>
        </footer>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.log('Service Worker registration failed', err));
            });
        }
    </script>
</body>
</html>
