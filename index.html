<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kangaroo Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <header>
        <h1>Math Kangaroo Practice</h1>
        <button id="theme-toggle">Toggle Dark Mode</button>
    </header>
    <main>
        <section id="setup">
            <label for="grade-select">Choose your grade:</label>
            <select id="grade-select">
                <option value="">Select...</option>
                <option value="1-2">Grade 1-2</option>
                <option value="3-4">Grade 3-4</option>
                <option value="5-6">Grade 5-6</option>
            </select>
            <button id="start-btn">Start Practice</button>
        </section>
        <section id="quiz" class="hidden">
            <div id="hud">
                <div id="timer-container">
                    <span id="timer">Time: 00:00</span>
                    <button id="pause-btn">Pause</button>
                </div>
                <div id="current-score">Score: 0</div>
            </div>
            <div id="badges-container" class="hidden">
                <h3>Earned Badges:</h3>
                <div id="badges-list"></div>
            </div>
            <div id="questions-container"></div>
            <button id="submit-btn">Submit Answers</button>
            <div id="results" class="hidden"></div>
            <div id="permalink-container">
                <p>Permalink to this practice set:</p>
                <input type="text" id="permalink-input" readonly>
                <button id="copy-link-btn">Copy Link</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
